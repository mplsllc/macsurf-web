<!DOCTYPE html><html><head><meta charset="utf-8"><title>Tests</title></head><body>
<pre id="r"></pre>
<script>
var r=document.getElementById('r'),p=0,f=0;
function T(n,fn){
 try{var o=fn();if(o===true||o===undefined){p++;r.textContent+='PASS '+n+'\n'}
 else{f++;r.textContent+='FAIL '+n+': '+o+'\n'}
 console.log('LIFE TEST '+(o===true||o===undefined?'PASS ':'FAIL ')+n+' => '+((o===null)?'null':(typeof o)+':'+o));}
 catch(e){f++;r.textContent+='FAIL '+n+': '+e.message+'\n'
 console.log('LIFE TEST FAIL '+n+' THREW => '+e.message);}
}
console.log('LIFE PAGE readyState='+document.readyState+' body='+(typeof document.body)+' bodyNull='+(document.body===null));
T('URLSearchParams object',function(){return new URLSearchParams({k:'v'}).get('k')==='v'});
T('URLSearchParams array',function(){return new URLSearchParams([['a','1']]).get('a')==='1'});
T('NodeFilter.SHOW_TEXT',function(){return NodeFilter.SHOW_TEXT===4});
T('DOMPurify.sanitize',function(){return typeof DOMPurify==='object'&&typeof DOMPurify.sanitize==='function'});
T('Node.ELEMENT_NODE',function(){return Node.ELEMENT_NODE===1});
T('el instanceof Node',function(){return document.createElement('div') instanceof Node});
T('el instanceof HTMLElement',function(){return document.createElement('div') instanceof HTMLElement});
T('contentEditable',function(){var d=document.createElement('div');return d.contentEditable==='inherit'&&(d.contentEditable='true',d.isContentEditable)});
T('getSelection',function(){return typeof getSelection()==='object'});
T('createRange',function(){return typeof document.createRange().setStart==='function'});
T('createTreeWalker',function(){return typeof document.createTreeWalker==='function'});
/* tagName case-insensitive now; the raw tagName is probed below */
T('innerHTML detached',function(){var d=document.createElement('div');d.innerHTML='<p>hi</p>';var c=d.firstChild;return !!(c&&c.tagName&&c.tagName.toUpperCase()==='P')});
T('appendChild works',function(){var d=document.createElement('div');var p=document.createElement('p');d.appendChild(p);return d.firstChild===p});
T('innerHTML attached',function(){var d=document.createElement('div');document.body.appendChild(d);d.innerHTML='<p>hi</p>';var ok=!!(d.firstChild&&d.firstChild.tagName&&d.firstChild.tagName.toUpperCase()==='P');document.body.removeChild(d);return ok});
T('rAF',function(){return typeof requestAnimationFrame==='function'});
T('createEvent',function(){return typeof document.createEvent('MouseEvents').initMouseEvent==='function'});
T('hasFocus',function(){return document.hasFocus()===true});
T('implementation',function(){return typeof document.implementation.hasFeature==='function'});
T('MouseEvent',function(){return new MouseEvent('c',{clientX:100}).clientX===100});
T('KeyboardEvent',function(){return new KeyboardEvent('k',{key:'Enter'}).key==='Enter'});
T('queryCommandSupported',function(){return document.queryCommandSupported('bold')===true});
/* ---- fingerprint probes: log every value, never rely on T() ---- */
(function(){
var d=document.createElement('div'),p=document.createElement('p');
d.appendChild(p);
var fc=d.firstChild;
console.log('LIFE PROBE append fc_null='+(fc===null)+' fc_is_p='+(fc===p)+' fc_type='+(fc?fc.nodeType:'n/a')+' fc_tag='+(fc?(fc.tagName||'?'):'n/a')+' cn='+d.childNodes.length+' kids='+d.children.length+' has='+d.hasChildNodes()+' cn0_is_p='+(d.childNodes[0]===p)+' parent_is_d='+(p.parentNode===d));
var e=document.createElement('div');e.innerHTML='<p>hi</p>';
var fe=e.firstChild;
console.log('LIFE PROBE innerHTML fc_null='+(fe===null)+' fc_tag='+(fe?(fe.tagName||'?'):'n/a')+' tc='+e.textContent+' cn='+e.childNodes.length+' e2='+e.outerHTML);
var t=document.createElement('div');t.innerHTML='hi';
var ft=t.firstChild;
console.log('LIFE PROBE innerHTML-text fc_null='+(ft===null)+' fc_type='+(ft?ft.nodeType:'n/a')+' tc='+t.textContent+' cn='+t.childNodes.length);
console.log('LIFE PROBE typeof rAF='+typeof requestAnimationFrame+' cancelAF='+typeof cancelAnimationFrame+' MouseEvent='+typeof MouseEvent+' KeyboardEvent='+typeof KeyboardEvent);
console.log('LIFE PROBE doc createEvent='+typeof document.createEvent+' hasFocus='+typeof document.hasFocus+' implementation='+typeof document.implementation+' qcs='+typeof document.queryCommandSupported+' createRange='+typeof document.createRange+' tw='+typeof document.createTreeWalker+' gs='+typeof document.getSelection);
var ce=null;try{ce=document.createEvent('MouseEvents');}catch(err){ce='THREW '+err.message;}
console.log('LIFE PROBE createEvent ret='+(typeof ce==='string'?ce:(typeof ce+' initME='+typeof (ce&&ce.initMouseEvent))));
})();
r.textContent+='\n'+(f?'FAILED':'ALL PASSED')+': '+p+'/'+(p+f);
/* ---- second pass after DOMContentLoaded: same key checks, PROBE2 ---- */
document.addEventListener('DOMContentLoaded',function(){
 var d=document.createElement('div'),p=document.createElement('p');
 d.appendChild(p);
 var fc=d.firstChild;
 console.log('LIFE PROBE2 readyState='+document.readyState+' append fc_null='+(fc===null)+' fc_is_p='+(fc===p)+' cn='+d.childNodes.length+' kids='+d.children.length+' has='+d.hasChildNodes()+' parent_is_d='+(p.parentNode===d));
 var e=document.createElement('div');e.innerHTML='<p>hi</p>';
 var fe=e.firstChild;
 console.log('LIFE PROBE2 innerHTML fc_null='+(fe===null)+' fc_tag='+(fe?(fe.tagName||'?'):'n/a')+' tc='+e.textContent+' cn='+e.childNodes.length);
 console.log('LIFE PROBE2 typeof rAF='+typeof requestAnimationFrame+' MouseEvent='+typeof MouseEvent+' KeyboardEvent='+typeof KeyboardEvent+' qcs='+typeof document.queryCommandSupported+' hasFocus='+typeof document.hasFocus);
});
</script>
</body></html>
